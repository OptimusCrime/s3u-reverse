<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S3 Reimplementation Progress</title>
<!--
  Progress of the Settlers 3 reimplementation as a treemap.
  Static page: the data comes from progress-data.js next to it, which
  `python tools/progress.py` regenerates from re/functions.csv.
  Open this file in a browser, or publish it together with progress-data.js.
-->
<style>
  :root {
    --bg: #f7f7f8; --fg: #1d2026; --muted: #5d6470; --card: #ffffff; --line: #e1e3e7;
    --cat: #2b2f36; --group: #5b616b; --tip-bg: #1d2026; --tip-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181c; --fg: #e7e9ec; --muted: #9aa1ab; --card: #1f2228; --line: #30343b;
      --cat: #0e0f12; --group: #3a3f47; --tip-bg: #e7e9ec; --tip-fg: #16181c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181c; --fg: #e7e9ec; --muted: #9aa1ab; --card: #1f2228; --line: #30343b;
    --cat: #0e0f12; --group: #3a3f47; --tip-bg: #e7e9ec; --tip-fg: #16181c;
  }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg);
         font: 15px/1.5 "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width: 1600px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 28px 0 8px; }
  code { font-size: 13px; }
  .muted { color: var(--muted); }
  .stats { display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 16px; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .bar { display: flex; height: 16px; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
  .bar span { display: block; height: 100%; }
  table { border-collapse: collapse; margin-top: 10px; font-variant-numeric: tabular-nums; }
  td, th { padding: 3px 14px 3px 0; text-align: right; }
  td:first-child, th:first-child { text-align: left; }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 8px; vertical-align: -1px; }
  .crumbs { margin: 0 0 8px; min-height: 22px; }
  .crumbs a { color: inherit; cursor: pointer; text-decoration: underline; }
  #map { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px; }
  #map svg { display: block; width: 100%; height: auto; }
  #map svg { cursor: zoom-in; }
  #tip { position: fixed; pointer-events: none; background: var(--tip-bg); color: var(--tip-fg);
         padding: 6px 9px; border-radius: 6px; font-size: 13px; max-width: 420px; display: none;
         white-space: pre-line; z-index: 10; }
  #history svg { width: 100%; max-width: 760px; height: auto; }
  .grid { stroke: var(--line); }
  .axis { fill: var(--muted); font-size: 11px; }
</style>
</head>
<body>
<main>
  <h1>Settlers 3 reimplementation progress</h1>
  <div class="muted" id="generated"></div>
  <div class="stats" id="stats"></div>
  <div class="bar" id="bar"></div>
  <table id="legend"></table>

  <h2>Treemap</h2>
  <div class="muted">Each box is one function of S3.EXE, sized by its code size.
    Hover for details; click a group to zoom in.</div>
  <div class="crumbs" id="crumbs"></div>
  <div id="map"></div>

  <h2>History</h2>
  <div class="muted">Share of all code bytes at each commit that changed the inventory.
    <span style="color:#3d9a50">●</span> verified &nbsp;
    <span style="color:#d9a53a">●</span> identified or better</div>
  <div id="history"></div>
</main>
<div id="tip"></div>

<script src="progress-data.js"></script>
<script>
"use strict";

const STATUS = [  // index = status code in the data file
  { key: "unknown",       label: "Not looked at",                 color: "#c9ccd1" },
  { key: "classified",    label: "Classified (class/role known)", color: "#e8a39b" },
  { key: "identified",    label: "Identified (purpose known)",    color: "#f2c86b" },
  { key: "reimplemented", label: "Reimplemented, not verified",   color: "#a9d18e" },
  { key: "verified",      label: "Reimplemented and verified",    color: "#3d9a50" },
];
const VERIFIED = 4;
const CATEGORY_LABEL = {
  game: "Game code (Blue Byte)",
  unidentified: "Not yet identified (probably game code)",
  crt: "C runtime", watcom: "Watcom container library",
  compiler: "Compiler-generated", stl: "C++ standard library", mfc: "MFC",
};

const data = window.PROGRESS_DATA;
const hex = (a) => "0x" + a.toString(16).padStart(8, "0");
const pct = (part, whole, digits = 2) => (whole ? (100 * part / whole) : 0).toFixed(digits) + "%";
const fmt = (n) => n.toLocaleString("en-US");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ------------------------------------------------------------ build the tree
// Tree: root -> category -> group -> function leaves.
function buildTree() {
  const root = { name: "S3.EXE", children: [] };
  const categories = new Map();
  const groups = data.groups.map(([category, name]) => {
    if (!categories.has(category)) {
      const node = { name: CATEGORY_LABEL[category] || category, category, children: [] };
      categories.set(category, node);
      root.children.push(node);
    }
    const group = { name, children: [] };
    categories.get(category).children.push(group);
    return group;
  });
  for (const [address, size, status, group, name] of data.functions) {
    groups[group].children.push({ address, size, status, name: name || "FUN_" + address.toString(16).padStart(8, "0") });
  }
  (function sum(node) {
    if (!node.children) return;
    node.size = 0; node.done = 0;
    for (const child of node.children) {
      child.parent = node;
      sum(child);
      node.size += child.size;
      node.done += child.children ? child.done : (child.status === VERIFIED ? child.size : 0);
    }
    node.children.sort((a, b) => b.size - a.size);
  })(root);
  return root;
}

// ------------------------------------------------------------ squarified treemap
// Bruls, Huizing, van Wijk. Children must be sorted by size, largest first.
function squarify(items, x, y, w, h) {
  const total = items.reduce((s, it) => s + it.size, 0);
  const rects = [];
  if (total <= 0 || w <= 0 || h <= 0) return items.map(() => [x, y, 0, 0]);
  const areas = items.map((it) => it.size * w * h / total);
  let i = 0;
  while (i < areas.length) {
    const short = Math.min(w, h);
    const worst = (row, s) => Math.max(...row.map((a) => Math.max(s * s / (short * short * a), short * short * a / (s * s))));
    const row = [areas[i++]];
    let rowSum = row[0];
    while (i < areas.length && worst([...row, areas[i]], rowSum + areas[i]) <= worst(row, rowSum)) {
      rowSum += areas[i]; row.push(areas[i++]);
    }
    if (w >= h) {          // column on the left
      const cw = rowSum / h; let cy = y;
      for (const a of row) { rects.push([x, cy, cw, a / cw]); cy += a / cw; }
      x += cw; w -= cw;
    } else {               // row on top
      const rh = rowSum / w; let cx = x;
      for (const a of row) { rects.push([cx, y, a / rh, rh]); cx += a / rh; }
      y += rh; h -= rh;
    }
  }
  return rects;
}

// ------------------------------------------------------------ draw the treemap
const tree = buildTree();
let zoomPath = [tree];       // root ... currently shown node
const nodesById = [];        // for hover/click lookup

function draw() {
  const box = document.getElementById("map");
  const width = Math.max(320, box.clientWidth - 8);
  const height = Math.round(Math.max(360, Math.min(width * 0.62, 1000)));
  const out = [];
  nodesById.length = 0;
  const r = (v) => Math.round(v * 10) / 10;

  // depth 0 = the shown node's children (dark headers), deeper levels lighter
  function layout(node, x, y, w, h, depth) {
    const rects = squarify(node.children, x, y, w, h);
    node.children.forEach((child, k) => {
      const [cx, cy, cw, ch] = rects[k];
      if (cw < 0.1 || ch < 0.1) return;
      const id = nodesById.push(child) - 1;
      if (!child.children) {
        const stroke = cw > 2 && ch > 2 ? ' stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.4"' : "";
        out.push(`<rect data-id="${id}" x="${r(cx)}" y="${r(cy)}" width="${r(cw)}" height="${r(ch)}" fill="${STATUS[child.status].color}"${stroke}/>`);
        return;
      }
      const headerSize = depth === 0 ? 18 : 12;
      const header = ch > headerSize * 2 && cw > 50 ? headerSize : 0;
      out.push(`<rect class="zoomable" data-id="${id}" x="${r(cx)}" y="${r(cy)}" width="${r(cw)}" height="${r(ch)}" ` +
               `fill="var(${depth === 0 ? "--cat" : "--group"})" stroke="var(--card)" stroke-width="${depth === 0 ? 2 : 0.6}"/>`);
      if (header) {
        const fontSize = depth === 0 ? 12 : 9;
        let label = child.name + (depth === 0 ? ` — ${pct(child.done, child.size, 1)} verified` : "");
        const maxChars = Math.floor((cw - 6) / (fontSize * 0.58));
        if (label.length > maxChars) label = label.slice(0, Math.max(1, maxChars - 1)) + "…";
        out.push(`<text class="zoomable" data-id="${id}" x="${r(cx + 4)}" y="${r(cy + fontSize + 2)}" font-size="${fontSize}" ` +
                 `font-weight="${depth === 0 ? 600 : 400}" fill="#ffffff">${esc(label)}</text>`);
      }
      const pad = depth === 0 ? 2 : 0.5;
      layout(child, cx + pad, cy + header + pad, cw - 2 * pad, ch - header - 2 * pad, depth + 1);
    });
  }
  layout(zoomPath[zoomPath.length - 1], 0, 0, width, height, 0);
  box.innerHTML = `<svg viewBox="0 0 ${width} ${height}" font-family="Segoe UI, Helvetica, Arial, sans-serif">${out.join("")}</svg>`;

  document.getElementById("crumbs").innerHTML = zoomPath.map((node, k) =>
    k === zoomPath.length - 1 ? `<b>${esc(node.name)}</b>` : `<a data-depth="${k}">${esc(node.name)}</a>`
  ).join(" › ");
}

// hover tooltip and click-to-zoom (one listener for all boxes)
const tip = document.getElementById("tip");
const map = document.getElementById("map");
map.addEventListener("mousemove", (event) => {
  const id = event.target.dataset && event.target.dataset.id;
  if (id === undefined) { tip.style.display = "none"; return; }
  const node = nodesById[id];
  tip.textContent = node.children
    ? `${node.name}\n${fmt(node.size)} bytes, ${pct(node.done, node.size)} verified`
    : `${node.name}\n${hex(node.address)}, ${fmt(node.size)} bytes\n${STATUS[node.status].label}`;
  tip.style.display = "block";
  const x = Math.min(event.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
  const y = event.clientY + 16 + tip.offsetHeight > window.innerHeight ? event.clientY - tip.offsetHeight - 10 : event.clientY + 16;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});
map.addEventListener("mouseleave", () => { tip.style.display = "none"; });
map.addEventListener("click", (event) => {
  const id = event.target.dataset && event.target.dataset.id;
  if (id === undefined) return;
  // a function box zooms into its group; a group or category into itself
  let target = nodesById[id];
  if (!target.children) target = target.parent;
  const current = zoomPath[zoomPath.length - 1];
  if (target === current) return;
  const path = [];
  for (let node = target; node && node !== current; node = node.parent) path.unshift(node);
  zoomPath.push(...path);
  tip.style.display = "none";
  draw();
});
document.getElementById("crumbs").addEventListener("click", (event) => {
  const depth = event.target.dataset && event.target.dataset.depth;
  if (depth === undefined) return;
  zoomPath = zoomPath.slice(0, Number(depth) + 1);
  draw();
});
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(draw, 150); });

// ------------------------------------------------------------ summary
function summary() {
  const count = STATUS.map(() => 0), bytes = STATUS.map(() => 0);
  for (const [, size, status] of data.functions) { count[status]++; bytes[status] += size; }
  const totalBytes = bytes.reduce((a, b) => a + b, 0);
  const game = tree.children.filter((c) => c.category === "game" || c.category === "unidentified");
  const gameBytes = game.reduce((s, c) => s + c.size, 0), gameDone = game.reduce((s, c) => s + c.done, 0);

  document.getElementById("generated").innerHTML =
    `Generated ${esc(data.generated)} from <code>re/functions.csv</code> by <code>tools/progress.py</code>.`;
  document.getElementById("stats").innerHTML = [
    [pct(bytes[VERIFIED], totalBytes), "of all code verified"],
    [pct(gameDone, gameBytes), "of game code verified"],
    [`${fmt(count[VERIFIED])} / ${fmt(data.functions.length)}`, "functions verified"],
    [fmt(data.functions.length - count[0]), "functions named"],
  ].map(([value, label]) => `<div class="stat"><b>${value}</b>${label}</div>`).join("");
  document.getElementById("bar").innerHTML = STATUS.map((s, k) =>
    `<span style="width:${100 * bytes[k] / totalBytes}%;background:${s.color}" title="${s.label}: ${fmt(bytes[k])} bytes"></span>`).join("");
  document.getElementById("legend").innerHTML =
    "<tr><th>Status</th><th>Functions</th><th>Bytes</th><th>Share</th></tr>" +
    STATUS.map((s, k) => `<tr><td><span class="swatch" style="background:${s.color}"></span>${s.label}</td>` +
      `<td>${fmt(count[k])}</td><td>${fmt(bytes[k])}</td><td>${pct(bytes[k], totalBytes)}</td></tr>`).join("");
  return totalBytes;
}

// ------------------------------------------------------------ history chart
function history(totalBytes) {
  const points = data.history;  // [date, commit, verified functions, verified bytes, understood bytes]
  const el = document.getElementById("history");
  if (points.length < 2) { el.innerHTML = "<p class='muted'>Not enough history yet.</p>"; return; }
  const W = 760, H = 220, L = 50, R = 10, T = 10, B = 30;
  const ymax = Math.max(...points.map((p) => p[4])) * 1.1 || 1;
  const px = (i) => L + (W - L - R) * i / (points.length - 1);
  const py = (v) => T + (H - T - B) * (1 - v / ymax);
  const out = [];
  for (let k = 0; k <= 4; k++) {
    const v = ymax * k / 4;
    out.push(`<line class="grid" x1="${L}" x2="${W - R}" y1="${py(v)}" y2="${py(v)}"/>` +
             `<text class="axis" x="${L - 6}" y="${py(v) + 4}" text-anchor="end">${pct(v, totalBytes, 1)}</text>`);
  }
  for (const [key, color] of [[4, "#d9a53a"], [3, "#3d9a50"]]) {
    out.push(`<polyline fill="none" stroke="${color}" stroke-width="2" points="${points.map((p, i) => px(i) + "," + py(p[key])).join(" ")}"/>`);
    points.forEach((p, i) => out.push(
      `<circle cx="${px(i)}" cy="${py(p[key])}" r="3" fill="${color}"><title>${p[0]} ${p[1]}: ` +
      `${fmt(p[key])} bytes (${pct(p[key], totalBytes)})${key === 3 ? `, ${p[2]} functions` : ""}</title></circle>`));
  }
  out.push(`<text class="axis" x="${px(0)}" y="${H - 8}">${points[0][0]}</text>` +
           `<text class="axis" x="${px(points.length - 1)}" y="${H - 8}" text-anchor="end">${points[points.length - 1][0]}</text>`);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verified and understood share of code over time">${out.join("")}</svg>`;
}

if (!data) {
  document.querySelector("main").innerHTML = "<h1>No data</h1><p>progress-data.js is missing. Run <code>python tools/progress.py</code>.</p>";
} else {
  history(summary());
  draw();
}
</script>
</body>
</html>
